[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-credit-dw"
version = "0.1.0"
description = "CO4031 - Data Warehouse & DSS on the Home Credit Default Risk dataset"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
etl = ["kaggle>=1.6", "six"]  # kaggle 2.x imports six without declaring it
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45", "joblib>=1.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hcdw = "hcdw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hcdw*", "dss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
