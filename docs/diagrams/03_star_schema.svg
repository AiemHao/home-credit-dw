  <rect class="fk" x="394" y="408" width="26" height="15" rx="4"/><text x="407" y="419" class="fkt" text-anchor="middle">FK</text><text x="430" y="420" class="c">region_key</text>
  <rect class="fk" x="394" y="432" width="26" height="15" rx="4"/><text x="407" y="443" class="fkt" text-anchor="middle">FK</text><text x="430" y="444" class="c">application_date_key</text>
  <rect class="row" x="381" y="456" width="268" height="1"/>
  <text x="430" y="474" class="cm">target</text><text x="636" y="474" class="m" text-anchor="end">0 / 1 / NULL</text>
  <text x="430" y="498" class="cm">is_train</text>
  <text x="430" y="522" class="cm">amt_credit</text><text x="636" y="522" class="m" text-anchor="end">Σ</text>
  <text x="430" y="546" class="cm">amt_income</text><text x="636" y="546" class="m" text-anchor="end">Σ</text>
  <text x="430" y="570" class="cm">debt_to_income</text>
  <text x="430" y="594" class="cm">ext_source_mean</text>
  <text x="430" y="618" class="cm">max_dpd_days</text>
  <text x="430" y="634" class="m">+ 5 more measures</text>
</g>

