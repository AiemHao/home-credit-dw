<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 890" width="1240" height="890" role="img" aria-labelledby="dg3-t dg3-d">
<title id="dg3-t">Star schema (fact constellation)</title>
<desc id="dg3-d">Two fact tables, fact_loan_application (one row per application) and fact_bureau_credit (one row per bureau credit), share dim_customer and dim_time. The application fact also uses dim_contract, dim_region and the mini-dimension dim_credit_history; the bureau fact uses the junk dimension dim_bureau_category and dim_time twice (open and close date).</desc>
<style>
.dg{--canvas:#fcfcfb;--bg:#ffffff;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--org:#eb6834;--org-soft:#fdeee6;--org-ink:#b4441a;--ext:#efeeea;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){.dg{--canvas:#1a1a19;--bg:#232321;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--org:#d95926;--org-soft:#3a2117;--org-ink:#f2a27e;--ext:#2c2c2a}}
:root[data-theme=light] .dg{--canvas:#fcfcfb;--bg:#ffffff;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--org:#eb6834;--org-soft:#fdeee6;--org-ink:#b4441a;--ext:#efeeea}
:root[data-theme=dark] .dg{--canvas:#1a1a19;--bg:#232321;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--org:#d95926;--org-soft:#3a2117;--org-ink:#f2a27e;--ext:#2c2c2a}
.dg text{fill:var(--ink)}.dg .t3{fill:var(--ink3)}
.dg .canvas{fill:var(--canvas)}
.dg .tbl{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.dg .hd{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.2}.dg .hdf{fill:var(--org-soft);stroke:var(--org);stroke-width:1.2}
.dg .fr{stroke:var(--org);stroke-width:1.6;fill:none}.dg .dr{stroke:var(--acc);stroke-width:1.4;fill:none}
.dg .nm{font-family:"Cascadia Code",Consolas,ui-monospace,monospace;font-size:13.5px;font-weight:700}
.dg .tag{font-size:10.5px;font-weight:700;letter-spacing:0.7px;fill:var(--acc-ink)}.dg .tagf{font-size:10.5px;font-weight:700;letter-spacing:0.7px;fill:var(--org-ink)}
.dg .c{font-family:"Cascadia Code",Consolas,ui-monospace,monospace;font-size:12.5px;fill:var(--ink)}
.dg .cm{font-family:"Cascadia Code",Consolas,ui-monospace,monospace;font-size:12.5px;fill:var(--ink2)}
.dg .pk{fill:var(--acc-soft)}.dg .pkt{font-size:9.5px;font-weight:700;fill:var(--acc-ink)}
.dg .fk{fill:var(--ext)}.dg .fkt{font-size:9.5px;font-weight:700;fill:var(--ink2)}
.dg .m{font-size:11px;fill:var(--ink3)}
.dg .e{fill:none;stroke:var(--ink3);stroke-width:1.5}.dg .dash{stroke-dasharray:6 5}
.dg .cf{fill:none;stroke:var(--ink3);stroke-width:1.5}
.dg .lb{font-size:11.5px;fill:var(--ink2);font-family:"Cascadia Code",Consolas,ui-monospace,monospace;paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round}
.dg .lg{font-size:12.5px;fill:var(--ink2)}
.dg .row{fill:var(--line);opacity:0.35}
</style>
<defs>
  <!-- "many" end (crow's foot) and "one" end (bar) -->
  <marker id="dg3-many" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path class="cf" d="M13,1 L2,7 L13,13 M2,7 H13"/></marker>
  <marker id="dg3-one" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path class="cf" d="M6,1 V13"/></marker>
</defs>
<rect class="canvas" width="1240" height="890"/>

<!-- ===== Relationships (under the tables) ===== -->
<path class="e" d="M260,124 C330,124 314,330 378,330" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M260,372 C320,372 316,404 378,404" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M260,616 C330,616 314,478 378,478" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M640,228 C640,246 566,240 566,258" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M790,228 C790,256 880,250 880,278" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M1020,186 V278" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M640,680 C640,662 566,664 566,646" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e" d="M740,680 C740,630 900,636 900,594" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<path class="e dash" d="M790,680 C790,646 990,646 990,594" marker-start="url(#dg3-one)" marker-end="url(#dg3-many)"/>
<text x="792" y="633" class="lb">open_date_key</text>
<text x="934" y="660" class="lb">close_date_key (0..1)</text>

<!-- ===== Facts ===== -->
