  <path class="fr" d="M380,270 a10,10 0 0 1 10,-10 H640 a10,10 0 0 1 10,10 V634 a10,10 0 0 1 -10,10 H390 a10,10 0 0 1 -10,-10 Z"/>
  <text x="396" y="282" class="tagf">FACT · 1 ROW PER APPLICATION</text>
