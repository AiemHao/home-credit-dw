  <rect class="pk" x="394" y="312" width="26" height="15" rx="4"/><text x="407" y="323" class="pkt" text-anchor="middle">PK</text><text x="430" y="324" class="c">application_id</text>
  <rect class="fk" x="394" y="336" width="26" height="15" rx="4"/><text x="407" y="347" class="fkt" text-anchor="middle">FK</text><text x="430" y="348" class="c">customer_key</text>
  <rect class="fk" x="394" y="360" width="26" height="15" rx="4"/><text x="407" y="371" class="fkt" text-anchor="middle">FK</text><text x="430" y="372" class="c">credit_history_key</text>
