<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-labelledby="dg5-t dg5-d">
<title id="dg5-t">Query flow of one OLAP request</title>
<desc id="dg5-d">The analyst clicks a bar; the React app updates the shared filters and calls the API; the API validates the names, asks the query layer, which answers from its cache or runs a GROUP BY on DuckDB; the JSON result re-renders the charts.</desc>
<style>
.dg{--canvas:#fcfcfb;--bg:#ffffff;--panel:#f4f4f1;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--teal:#1baf7a;--teal-soft:#e3f5ee;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){.dg{--canvas:#1a1a19;--bg:#232321;--panel:#151514;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--teal:#199e70;--teal-soft:#11302a}}
:root[data-theme=light] .dg{--canvas:#fcfcfb;--bg:#ffffff;--panel:#f4f4f1;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--teal:#1baf7a;--teal-soft:#e3f5ee}
:root[data-theme=dark] .dg{--canvas:#1a1a19;--bg:#232321;--panel:#151514;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--teal:#199e70;--teal-soft:#11302a}
.dg text{fill:var(--ink)}.dg .t3{fill:var(--ink3)}
.dg .canvas{fill:var(--canvas)}
.dg .head{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.dg .heada{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.dg .ti{font-size:15px;font-weight:600}.dg .sub{font-size:11.5px;fill:var(--ink3)}
.dg .life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 5}
.dg .act{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1}
.dg .m{fill:none;stroke:var(--ink2);stroke-width:1.5}.dg .r{fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-dasharray:6 4}
.dg .ah{fill:var(--ink2)}.dg .ahr{fill:var(--ink3)}
.dg .msg{font-size:12.5px;fill:var(--ink)}.dg .code{font-family:"Cascadia Code",Consolas,ui-monospace,monospace;font-size:12px;fill:var(--acc-ink)}
.dg .note{font-size:11.5px;fill:var(--ink3)}
.dg .badge{fill:var(--acc)}.dg .bt{fill:#fff;font-size:11px;font-weight:700}
.dg .frame{fill:var(--panel);stroke:var(--line);stroke-width:1.2;opacity:0.9}
.dg .tab{fill:var(--line)}.dg .tabt{font-size:11.5px;font-weight:700;fill:var(--ink2)}
.dg .div{stroke:var(--ink3);stroke-width:1;stroke-dasharray:5 4}
.dg .guard{font-size:11.5px;font-weight:600;fill:var(--ink2)}
.dg .lb{paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round}
.dg .lbp{paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
</style>
<defs>
  <marker id="dg5-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="dg5-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="var(--ink3)" stroke-width="1.6"/></marker>
</defs>
<rect class="canvas" width="1240" height="640"/>

<!-- alt frame (drawn first) -->
<rect class="frame" x="530" y="352" width="690" height="170" rx="8"/>
<path class="tab" d="M530,360 a8,8 0 0 1 8,-8 H584 V368 l-8,8 H530 Z"/>
<text x="544" y="370" class="tabt">alt</text>
<text x="640" y="372" class="guard">[result already cached]</text>
<path class="div" d="M530,418 H1220"/>
<text x="640" y="436" class="guard">[first request for these filters]</text>

<!-- lifelines -->
<path class="life" d="M110,78 V620"/>
<path class="life" d="M360,78 V620"/>
<path class="life" d="M620,78 V620"/>
<path class="life" d="M870,78 V620"/>
<path class="life" d="M1110,78 V620"/>

<!-- activation bars -->
<rect class="act" x="354" y="120" width="12" height="490" rx="2"/>
<rect class="act" x="614" y="215" width="12" height="340" rx="2"/>
<rect class="act" x="864" y="320" width="12" height="190" rx="2"/>
<rect class="act" x="1104" y="460" width="12" height="40" rx="2"/>

<!-- heads -->
<rect class="heada" x="20" y="18" width="180" height="60" rx="12"/>
<text x="110" y="44" class="ti" text-anchor="middle">Analyst</text><text x="110" y="62" class="sub" text-anchor="middle">browser user</text>
<rect class="head" x="260" y="18" width="200" height="60" rx="12"/>
<text x="360" y="44" class="ti" text-anchor="middle">React app</text><text x="360" y="62" class="sub" text-anchor="middle">shared filters · charts</text>
<rect class="head" x="520" y="18" width="200" height="60" rx="12"/>
<text x="620" y="44" class="ti" text-anchor="middle">FastAPI</text><text x="620" y="62" class="sub" text-anchor="middle">/api/* endpoints</text>
<rect class="head" x="770" y="18" width="200" height="60" rx="12"/>
<text x="870" y="44" class="ti" text-anchor="middle">Query layer</text><text x="870" y="62" class="sub" text-anchor="middle">whitelist · lru_cache</text>
<rect class="heada" x="1010" y="18" width="200" height="60" rx="12"/>
<text x="1110" y="44" class="ti" text-anchor="middle">DuckDB</text><text x="1110" y="62" class="sub" text-anchor="middle">hc.duckdb · read-only</text>

<!-- 1 click -->
<circle class="badge" cx="128" cy="112" r="9"/><text x="128" y="116" class="bt" text-anchor="middle">1</text>
<path class="m" d="M110,126 H352" marker-end="url(#dg5-m)"/>
<text x="146" y="116" class="msg lb">click bar “age 25–34”</text>

<!-- 2 self: update filters -->
<circle class="badge" cx="378" cy="150" r="9"/><text x="378" y="154" class="bt" text-anchor="middle">2</text>
<path class="m" d="M366,162 H410 V184 H368" marker-end="url(#dg5-m)"/>
<text x="420" y="178" class="msg">update shared filters (all pages)</text>

<!-- 3 GET -->
<circle class="badge" cx="384" cy="204" r="9"/><text x="384" y="208" class="bt" text-anchor="middle">3</text>
<path class="m" d="M366,228 H612" marker-end="url(#dg5-m)"/>
<text x="400" y="208" class="code lb">GET /api/by/income_type</text>
<text x="400" y="222" class="code lb">?age_bucket=25-34</text>

<!-- 4 self: validate -->
<circle class="badge" cx="638" cy="250" r="9"/><text x="638" y="254" class="bt" text-anchor="middle">4</text>
<path class="m" d="M626,262 H670 V284 H628" marker-end="url(#dg5-m)"/>
<text x="680" y="270" class="msg">check names against the whitelist</text>
<text x="680" y="286" class="note">unknown dimension or filter → 400</text>

<!-- 5 call query layer -->
<circle class="badge" cx="644" cy="312" r="9"/><text x="644" y="316" class="bt" text-anchor="middle">5</text>
<path class="m" d="M626,330 H862" marker-end="url(#dg5-m)"/>
<text x="660" y="320" class="code lb">by_dimension(dim, filters)</text>

<!-- alt: cached -->
<path class="r" d="M864,398 H628" marker-end="url(#dg5-r)"/>
<text x="746" y="390" class="msg lbp" text-anchor="middle">rows from memory · &lt; 5 ms</text>

<!-- alt: first request -->
<path class="m" d="M876,464 H1102" marker-end="url(#dg5-m)"/>
<text x="890" y="456" class="code lbp">SELECT … GROUP BY 1</text>
<path class="r" d="M1104,494 H878" marker-end="url(#dg5-r)"/>
<text x="990" y="486" class="msg lbp" text-anchor="middle">rows · 50–200 ms</text>
<path class="r" d="M864,512 H628" marker-end="url(#dg5-r)"/>
<text x="746" y="506" class="msg lbp" text-anchor="middle">rows (cached for next time)</text>

<!-- 6 JSON back -->
<circle class="badge" cx="604" cy="540" r="9"/><text x="604" y="544" class="bt" text-anchor="middle">6</text>
<path class="r" d="M614,552 H368" marker-end="url(#dg5-r)"/>
<text x="492" y="544" class="msg lb" text-anchor="middle">JSON · gzip</text>

<!-- 7 render -->
<circle class="badge" cx="342" cy="582" r="9"/><text x="342" y="586" class="bt" text-anchor="middle">7</text>
<path class="r" d="M354,596 H112" marker-end="url(#dg5-r)"/>
<text x="232" y="588" class="msg lb" text-anchor="middle">charts, KPIs, tables re-render</text>
</svg>
